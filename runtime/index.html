<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHCE Runtime · V0.1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230B0B0F'/><circle cx='8' cy='8' r='3.2' fill='%2307A954'/></svg>">
<style>
  :root{
    --bg:#06060a; --panel:rgba(13,13,18,.86); --line:rgba(255,255,255,.09);
    --fg:#F2F2F2; --muted:#85858f; --acc:#07A954; --acc2:#FD7AB4; --warn:#F0B429; --err:#FF5252;
    --mono:ui-monospace,"Fira Code","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-left:312px;transition:padding .22s ease}
  body.hud-hidden #stage{padding-left:0}
  @media (max-width:900px){#stage{padding-left:0}}
  #stage-inner{width:100%;height:100%;display:grid;place-items:center}
  #stage .art{display:block;transform-origin:center center;box-shadow:0 24px 80px rgba(0,0,0,.7);background:#000}
  #hud{
    position:fixed;top:16px;left:16px;width:296px;padding:14px;border-radius:14px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);
    font-size:12px;line-height:1.55;user-select:none;
  }
  #hud.hidden{display:none}
  .hidden{display:none !important}
  .title{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.04em;margin-bottom:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 0 transparent;transition:.2s}
  .dot.open{background:var(--acc);box-shadow:0 0 10px rgba(7,169,84,.7)}
  .dot.connecting{background:var(--warn);animation:pulse 1s infinite}
  .dot.retry,.dot.closed{background:var(--err)}
  @keyframes pulse{50%{opacity:.3}}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 10px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  button{
    font-family:var(--mono);font-size:11.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
    color:var(--fg);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.15s;
  }
  button:hover{background:rgba(255,255,255,.11)}
  button.on{background:rgba(7,169,84,.16);border-color:rgba(7,169,84,.55);color:#7CF0B0}
  button:active{transform:translateY(1px)}
  .sep{height:1px;background:var(--line);margin:10px 0}
  .label{color:var(--muted);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  #errs{max-height:88px;overflow:auto;color:var(--err);font-size:10.5px;line-height:1.5;white-space:pre-wrap}
  #errs:empty::after{content:"无错误";color:var(--muted)}
  .num{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10.5px}
  .num input{
    width:52px;font-family:var(--mono);font-size:11px;color:var(--fg);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;padding:3px 6px;
  }
  .num input:focus{outline:none;border-color:rgba(7,169,84,.55)}
  #exp-stat{color:var(--acc);font-size:10.5px;line-height:1.5;min-height:14px;margin-bottom:6px}
  #exp-stat:empty::after{content:"\\00a0"}
  #hint{position:fixed;right:16px;bottom:14px;color:var(--muted);font-size:10.5px;letter-spacing:.08em}
</style>
</head>
<body>
<div id="stage"><div id="stage-inner"></div></div>

<aside id="hud">
  <div class="title"><span class="dot" id="dot"></span><span>GHCE RUNTIME</span><span style="margin-left:auto;color:var(--muted)">v0.1</span></div>

  <dl class="kv">
    <dt>连接</dt><dd id="k-conn">—</dd>
    <dt>rev</dt><dd id="k-rev">—</dd>
    <dt>geometry / cmds</dt><dd id="k-count">—</dd>
    <dt>patch</dt><dd id="k-patch">—</dd>
    <dt>ops / 字节</dt><dd id="k-ops">—</dd>
    <dt>draw</dt><dd id="k-draw">—</dd>
    <dt>实体 · 步进</dt><dd id="k-ent">—</dd>
    <dt>时间</dt><dd id="k-time">—</dd>
    <dt>指针</dt><dd id="k-ptr">—</dd>
    <dt>绘帧/秒</dt><dd id="k-fps">—</dd>
  </dl>

  <div class="sep"></div>
  <div class="label" id="scenes-label">演示场景（模拟桥）</div>
  <div class="row" id="scenes">
    <button data-scene="static">Static</button>
    <button data-scene="mutate">Mutate</button>
    <button data-scene="stress">Stress 500</button>
    <button data-scene="entities">Entities</button>
    <button data-scene="living">Living</button>
  </div>

  <div class="sep"></div>
  <div class="label">播放（不依赖 GH 求解）</div>
  <div class="row">
    <button id="btn-play">暂停</button>
    <button id="btn-reset-time">重置时间</button>
    <button id="btn-restart">重启对象</button>
    <button id="btn-clear">清屏</button>
  </div>

  <div class="label">导出</div>
  <div class="row">
    <button id="btn-png">PNG ×2</button>
    <button id="btn-png-alpha">PNG 透明</button>
    <button id="btn-svg">SVG</button>
  </div>

  <div class="row" id="exp-opts">
    <label class="num">fps<input id="exp-fps" type="number" min="1" max="60" step="1" value="30"></label>
    <label class="num">秒<input id="exp-dur" type="number" min="0.2" max="120" step="0.1"></label>
  </div>
  <div class="row">
    <button id="btn-seq">PNG 序列 (zip)</button>
    <button id="btn-html">独立 HTML</button>
    <button id="btn-video">视频</button>
  </div>
  <div id="exp-stat"></div>

  <div class="sep"></div>
  <div class="label">错误</div>
  <div id="errs"></div>
</aside>

<div id="hint">H 隐藏面板 · R 重连 · 1/2/3 切换场景</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
