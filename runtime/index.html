<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHCE Runtime · V0.1</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.webgpu.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js"
  }
}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230B0B0F'/><circle cx='8' cy='8' r='3.2' fill='%2307A954'/></svg>">
<style>
  :root{
    --bg:#06060a; --panel:rgba(13,13,18,.88); --line:rgba(255,255,255,.09);
    --fg:#F2F2F2; --muted:#85858f; --acc:#07A954; --acc2:#FD7AB4; --warn:#F0B429; --err:#FF5252;
    --mono:ui-monospace,"Fira Code","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden}
  /* 画面铺满窗口：没有任何常驻面板去挤压或遮挡它 */
  #stage{position:fixed;inset:0}
  #stage-inner{position:relative;width:100%;height:100%;display:grid;place-items:center}
  /* 3D 层：铺满窗口，透明背景，压在 2D 之上。
     pointer-events 交给 JS 控制 —— 没有 3D 场景时它不该吃掉 2D 的鼠标。 */
  #layer-3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  #stage .art{display:block;transform-origin:center center;box-shadow:0 24px 80px rgba(0,0,0,.7);background:#000}

  /* 开发面板：默认不存在于画面里，H 才出现。只服务于调试，不属于作品。 */
  #dev{
    position:fixed;left:14px;bottom:14px;width:282px;padding:11px 12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);
    font-size:11.5px;line-height:1.5;user-select:none;z-index:9;
  }
  #dev[hidden]{display:none}
  .dev-head{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:var(--muted)}
  .dev-head button{margin-left:auto;padding:1px 7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:.2s}
  .dot.open{background:var(--acc);box-shadow:0 0 10px rgba(7,169,84,.7)}
  .dot.connecting{background:var(--warn);animation:pulse 1s infinite}
  .dot.retry,.dot.closed{background:var(--err)}
  @keyframes pulse{50%{opacity:.3}}
  .row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  button{
    font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:999px;cursor:pointer;
    color:var(--fg);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.15s;
  }
  button:hover{background:rgba(255,255,255,.11)}
  button.on{background:rgba(7,169,84,.16);border-color:rgba(7,169,84,.55);color:#7CF0B0}
  button:active{transform:translateY(1px)}
  .sep{height:1px;background:var(--line);margin:8px 0}
  .label{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
  #errs{max-height:64px;overflow:auto;color:var(--err);font-size:10px;line-height:1.45;white-space:pre-wrap}
  #errs:empty::after{content:"无错误";color:var(--muted)}
  .num{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px}
  .num input{
    width:48px;font-family:var(--mono);font-size:10.5px;color:var(--fg);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;padding:2px 5px;
  }
  .num input:focus{outline:none;border-color:rgba(7,169,84,.55)}
  #exp-stat{color:var(--acc);font-size:10px;line-height:1.45;min-height:12px;margin-bottom:4px}

  /* 出错才浮出来，4 秒后自己消失 —— 画面不常驻任何文字 */
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
    max-width:min(70vw,720px);padding:7px 14px;border-radius:999px;
    background:rgba(30,10,12,.92);border:1px solid rgba(255,82,82,.5);color:#FFb4b4;
    font-size:11.5px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:20;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="stage"><div id="stage-inner"><canvas id="layer-3d"></canvas></div></div>

<section id="dev" hidden>
  <div class="dev-head">
    <span class="dot" id="dot"></span>
    <span id="dev-line">—</span>
    <button id="dev-close">×</button>
  </div>

  <div class="row" id="scenes">
    <button data-scene="static">Static</button>
    <button data-scene="mutate">Mutate</button>
    <button data-scene="stress">Stress</button>
    <button data-scene="entities">Entities</button>
    <button data-scene="living">Living</button>
    <button data-scene="morph">Morph</button>
    <button data-scene="random">Noise</button>
    <button data-scene="scene3d">3D</button>
  </div>

  <div class="sep"></div>
  <div class="label">导出</div>
  <div class="row">
    <button id="btn-png">PNG ×2</button>
    <button id="btn-png-alpha">PNG 透明</button>
    <button id="btn-svg">SVG</button>
  </div>
  <div class="row">
    <label class="num">fps<input id="exp-fps" type="number" min="1" max="60" step="1" value="30"></label>
    <label class="num">秒<input id="exp-dur" type="number" min="0.2" max="120" step="0.1"></label>
  </div>
  <div class="row">
    <button id="btn-seq">PNG 序列</button>
    <button id="btn-html">独立 HTML</button>
    <button id="btn-video">视频</button>
  </div>
  <div id="exp-stat"></div>

  <div class="sep"></div>
  <div id="errs"></div>
</section>

<div id="toast"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
